[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "innopolis"
version = "0.1.0"
description = "Проект для университета иннополис"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "gdown>=6.2.0"
]
